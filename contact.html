<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact - My Portfolio</title>
    <div id="head-placeholder"></div>
</head>
<body class="d-flex flex-column h-100">
    <div class="wrapper">
        <div id="navbar-placeholder"></div>

        <section id="contact" class="container py-5">
            <h1 class="display-4 fw-bold text-center mb-5">Get in Touch</h1>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 p-lg-5">
                        <p class="lead text-center mb-5">Have a question or want to work together? Fill out the form below or reach out through my social channels.</p>
                        <form>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="email" placeholder="Your Email" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" placeholder="Subject" required>
                            </div>
                            <div class="mb-4">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="6" placeholder="Your Message" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="text-center mt-5 social-icons">
                <a href="#" class="me-4 text-secondary-blue"><i class="fab fa-linkedin fa-3x"></i></a>
                <a href="#" class="me-4 text-secondary-blue"><i class="fab fa-github fa-3x"></i></a>
            </div>
        </section>
    </div>

    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
